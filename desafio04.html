<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04 - Ordem de Serviço</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Portal DS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio01.html">Desafio 01</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio02.html">Desafio 02</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio03.html">Desafio 03</a></li>
                    <li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 04</a></li>
                    <li class="nav-item"><a class="nav-link" href="desafio05.html">Desafio 05</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7">
                <div class="card shadow-sm border-0 rounded-3 p-4">
                    <div class="mb-4">
                        <span class="badge bg-primary mb-2">SISTEMA DE ATENDIMENTO</span>
                        <h3 class="fw-bold mb-1">Abertura de Ordem de Serviço</h3>
                        <p class="text-muted small mb-0">Assistência Técnica TechFix — Campo Largo</p>
                    </div>

                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label for="nomeCliente" class="form-label fw-semibold">Nome Completo</label>
                                <input type="text" id="nomeCliente" class="form-control" placeholder="Ex.: Maria Oliveira" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="equipamento" class="form-label fw-semibold">Equipamento / Modelo</label>
                                <input type="text" id="equipamento" class="form-control" placeholder="Ex.: Notebook Dell Inspiron" required>
                            </div>

                            <div class="col-sm-6">
                                <label for="whatsapp" class="form-label fw-semibold">Telefone / WhatsApp</label>
                                <div class="input-group">
                                    <span class="input-group-text">+55</span>
                                    <input type="tel" id="whatsapp" class="form-control" placeholder="(41) 99999-9999" required>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label for="valorEstimado" class="form-label fw-semibold">Valor Estimado</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" id="valorEstimado" class="form-control" placeholder="150,00" step="0.01" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="tipoServico" class="form-label fw-semibold">Tipo de Serviço</label>
                                <select id="tipoServico" class="form-select" required>
                                    <option value="" selected disabled>Selecione o serviço solicitado...</option>
                                    <option value="formatacao">Formatação e Backup de Dados</option>
                                    <option value="limpeza">Limpeza Interna e Troca de Pasta Térmica</option>
                                    <option value="tela">Substituição de Tela / Display</option>
                                    <option value="bateria">Troca de Bateria ou Conector de Carga</option>
                                    <option value="orcamento">Avaliação Técnica / Orçamento</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="observacoes" class="form-label fw-semibold">Observações e Relato do Defeito</label>
                                <textarea id="observacoes" class="form-control" rows="3" placeholder="Descreva o problema apresentado, senha de acesso (se necessário) ou acessórios entregues junto ao aparelho..."></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="ciencia" class="form-check-input" required>
                                    <label for="ciencia" class="form-check-label small text-secondary">
                                        Declaro estar ciente das condições de avaliação técnica e autorizo a abertura desta Ordem de Serviço.
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn btn-primary w-100 fw-semibold py-2" type="submit">Registrar Ordem de Serviço</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
